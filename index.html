/* ===== src/hooks/useRoute.js ===== */
const parse=()=>{const h=location.hash.slice(1);return h==='admin'?{p:'admin'}:h.startsWith('game-')?{p:'game',id:h.slice(5)}:{p:'home'}};
const go=h=>{location.hash=h};
function useRoute(){const[r,s]=useState(parse);useEffect(()=>{const f=()=>{s(parse());scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);return r}

  <path d=${`M0 ${150+r()*40} L${100+r()*80} ${90+r()*40} L${220+r()*60} ${140+r()*40} L${320+r()*60} ${70+r()*50} L400 ${130+r()*40} V225 H0Z`} fill="#05050a" opacity=".55"/>
  ${Array.from({length:14},(_,i)=>html`<circle key=${'s'+i} cx=${r()*400} cy=${r()*120} r=${.6+r()*1.2} fill="#fff" opacity=${.25+r()*.5}/>`)}
  <radialGradient id=${id+'o'}><stop offset="0" stopColor=${`hsl(${h+30},95%,70%)`} stopOpacity=".85"/><stop offset="1" stopColor=${`hsl(${h+30},95%,60%)`} stopOpacity="0"/></radialGradient>
  <circle cx=${60+r()*280} cy=${50+r()*40} r="75" fill=${`url(#${id}o)`}/>
  <path d=${`M0 ${178+r()*20} L${90+r()*60} ${135+r()*20} L${200+r()*60} ${170+r()*20} L${300+r()*50} ${120+r()*25} L400 ${165+r()*20} V225 H0Z`} fill=${`hsl(${h},60%,6%)`} opacity=".85"/>

  <text x="202" y="121" textAnchor="middle" fontFamily="Rajdhani,sans-serif" fontWeight="700" fontSize=${fs} fill="#000" opacity=".45" letterSpacing="3">${t}</text>

function Home({games,q,genre,setGenre,browse,setBrowse}){
  const ql=q.trim().toLowerCase(),list=games.filter(g=>(genre==='All'||g.genre===genre)&&(!ql||[g.title,g.genre,g.desc,g.dev].join(' ').toLowerCase().includes(ql)));
  const filt=ql||genre!=='All'||browse,feat=games.find(g=>g.featured)||games[0],top=k=>[...games].sort((a,b)=>b[k]-a[k]).slice(0,4);
  const rec=[...games].sort((a,b)=>b.added.localeCompare(a.added)).slice(0,4);
  return html`<div className="w">${!filt&&feat&&html`<${Hero} g=${feat} games=${games} onBrowse=${()=>setBrowse(true)}/>`}
  <div className="lay"><${Side} games=${games} genre=${genre} setGenre=${setGenre} setBrowse=${setBrowse}/><main>
  ${filt?html`<${Sec} title=${ql?'Results for “'+q+'”':genre==='All'?'All games':genre} sub=${list.length+' game'+(list.length===1?'':'s')} items=${list}/>`
  :html`<${Sec} title="Recently Added" items=${rec}/><${Sec} title="Popular Games" sub="Top picks" rank=${1} items=${top('pop')} more=${()=>{setGenre('All');setBrowse(true)}}/><${Sec} title="Trending Now" items=${top('trend')}/>`}</main></div></div>`}

  <div className="acts"><button className="btn g s" onClick=${copy}>${c===1?'✓ Link copied':c===2?'Copy unavailable':'⧉ Copy link'}</button><a className="btn g s" href="#home">← More games</a></div>

/* ===== src/pages/Admin.jsx — demo admin (data stored in this browser only) ===== */
const BLANK={id:'',title:'',genre:'Action',year:2026,size:'',dev:'',lic:'',hue:260,url:'https://',desc:'',feat:[],req:{os:'',cpu:'',ram:'',gpu:'',disk:''},ver:'1.0',img:'',pop:5,trend:5,added:new Date().toISOString().slice(0,10),featured:false};
function Form({g,onSave,onClose}){
  const[f,setF]=useState(g),[ft,setFt]=useState(g.feat.join('\n')),[err,setErr]=useState('');
  useEffect(()=>{const k=e=>e.key==='Escape'&&onClose();addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
  const set=(k,v)=>setF(p=>({...p,[k]:v})),sr=(k,v)=>setF(p=>({...p,req:{...p.req,[k]:v}}));
  const sub=e=>{e.preventDefault();if(!f.title.trim()||!f.genre.trim())return setErr('Title and genre are required.');if(f.img&&!/^https:\/\//.test(f.img))return setErr('Cover image must be an https:// URL (or leave it empty).');
    if(!/^https:\/\/[^\s.\/]+\.[^\s]+$/.test(f.url))return setErr('Enter a valid https:// official download URL.');
    onSave({...f,title:f.title.trim(),genre:f.genre.trim(),year:+f.year||2026,pop:+f.pop||5,trend:+f.trend||5,feat:ft.split('\n').map(s=>s.trim()).filter(Boolean)})};
  const T=(k,l,t='text')=>html`<label>${l}<input className="in" type=${t} value=${f[k]??''} onChange=${e=>set(k,e.target.value)}/></label>`;
  return html`<div className="md"><form onSubmit=${sub}><h2 className="full">${g.id?'Edit game':'Add game'}</h2>
  ${T('title','Title')}${T('genre','Genre')}${T('year','Release year','number')}${T('size','File size (e.g. ~200 MB)')}${T('ver','Version')}${T('dev','Developer')}${T('lic','License')}${T('url','Official download URL (https)')}${T('img','Cover image URL (optional, https)')}${T('pop','Popularity (1–10)','number')}${T('trend','Trending (1–10)','number')}
  <label className="full">Description<textarea className="in" rows="3" value=${f.desc} onChange=${e=>set('desc',e.target.value)}/></label>
  <label className="full">Features (one per line)<textarea className="in" rows="3" value=${ft} onChange=${e=>setFt(e.target.value)}/></label>
  ${K.map(k=>html`<label key=${k}>Req: ${k.toUpperCase()}<input className="in" value=${f.req[k]} onChange=${e=>sr(k,e.target.value)}/></label>`)}
  <label>Cover color<input type="range" min="0" max="360" value=${f.hue} onChange=${e=>set('hue',+e.target.value)}/></label>
  <label><span><input type="checkbox" checked=${f.featured} onChange=${e=>set('featured',e.target.checked)}/> Featured on homepage</span></label>
  ${err&&html`<p className="err full">${err}</p>`}
  <div className="acts full"><button className="btn" type="submit">Save game</button><button className="btn g" type="button" onClick=${onClose}>Cancel</button></div></form></div>`}
function Admin({games,setGames}){
  const[ed,setEd]=useState(null),[del,setDel]=useState(null);useEffect(()=>{if(!del)return;const t=setTimeout(()=>setDel(null),3000);return()=>clearTimeout(t)},[del]);
  const save=g=>{let id=g.id;if(!id){const b=g.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'game';id=b;let n=2;while(games.some(x=>x.id===id))id=b+'-'+n++}
    const ng={...g,id};setGames(p=>{const o=g.id?p.map(x=>x.id===id?ng:x):[ng,...p];return ng.featured?o.map(x=>({...x,featured:x.id===id})):o});setEd(null)};
  return html`<div className="w pg"><div className="sh"><h2>Admin Dashboard</h2><div className="acts"><button className="btn" onClick=${()=>setEd(BLANK)}>+ Add game</button>
   <button className="btn g" onClick=${()=>{if(del==='reset'){setGames(SEED);setDel(null)}else setDel('reset')}}>${del==='reset'?'Confirm reset?':'Reset sample data'}</button></div></div>
  <p className="m" style=${{marginBottom:16}}>Demo admin: no login, and changes are saved only in this browser. Only add games whose licenses allow redistribution, with links to authorized files.</p>
  <div className="panel tw" style=${{marginTop:0}}><table className="at"><thead><tr><th>Title</th><th>Genre</th><th>Year</th><th>Size</th><th/></tr></thead><tbody>
  ${games.map(g=>html`<tr key=${g.id}><td>${g.title}${g.featured?' ★':''}</td><td>${g.genre}</td><td>${g.year}</td><td>${g.size}</td><td><div className="ac">
   <button className="btn g s" onClick=${()=>setEd(g)}>Edit</button>
   <button className=${'btn s '+(del===g.id?'d':'g')} onClick=${()=>{if(del===g.id){setGames(p=>p.filter(x=>x.id!==g.id));setDel(null)}else setDel(g.id)}}>${del===g.id?'Confirm?':'Delete'}</button></div></td></tr>`)}</tbody></table>
  ${!games.length&&html`<div className="empty">No games yet. Add one above.</div>`}</div>
  ${ed&&html`<${Form} g=${ed} onSave=${save} onClose=${()=>setEd(null)}/>`}</div>`}

/* ===== src/App.jsx ===== */
function App(){
  const route=useRoute(),[games,setGames]=useState(load),[q,setQ]=useState(''),[genre,setGenre]=useState('All'),[browse,setBrowse]=useState(false),[boot,setBoot]=useState(0),[busy,setBusy]=useState(false);
  useEffect(()=>{const a=setTimeout(()=>setBoot(1),900),b=setTimeout(()=>setBoot(2),1400);return()=>{clearTimeout(a);clearTimeout(b)}},[]);
  useEffect(()=>save(games),[games]);useEffect(()=>{if(genre!=='All'&&!games.some(g=>g.genre===genre))setGenre('All')},[games,genre]);
  useEffect(()=>{setBusy(true);const t=setTimeout(()=>setBusy(false),350);return()=>clearTimeout(t)},[route.p,route.id]);
  const reset=()=>{setQ('');setGenre('All');setBrowse(false)},game=route.p==='game'&&games.find(g=>g.id===route.id);
  return html`<div>${boot<2&&html`<${Splash} out=${boot===1}/>`}<${Nav} q=${q} setQ=${setQ} page=${route.p} reset=${reset}/>
  ${busy?html`<${Skeleton}/>`:route.p==='admin'?html`<${Admin} games=${games} setGames=${setGames}/>`:route.p==='game'?(game?html`<${Details} g=${game} games=${games}/>`:html`<div className="w pg"><div className="empty">Game not found. <a href="#home" style=${{color:'#a78bfa'}}>Back to library</a></div></div>`)
   :html`<${Home} games=${games} q=${q} genre=${genre} setGenre=${setGenre} browse=${browse} setBrowse=${setBrowse}/>`}
  <footer><div className="w">GAMEVAULT lists only free and open-source games that permit redistribution. Download buttons open each project’s official page. Not affiliated with the developers.</div></footer></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
